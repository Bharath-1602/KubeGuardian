# ────────────────────────────────────────
# nginx/mcp-server.conf
# KubeGuardian Nginx Reverse Proxy Configuration
# ────────────────────────────────────────
# - Port 80 redirects to HTTPS (443)
# - Port 443 with self-signed SSL terminates TLS
# - Proxies all requests to FastAPI backend at localhost:8000
# - MCP Server (localhost:8080) is internal only — not exposed
# ────────────────────────────────────────

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name _;

    # ──── SSL Configuration (self-signed) ────
    ssl_certificate     /etc/nginx/ssl/kubeguardian.crt;
    ssl_certificate_key /etc/nginx/ssl/kubeguardian.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ──── Security Headers ────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ──── Proxy Timeouts (K8s operations can take time) ────
    proxy_connect_timeout 120s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
    send_timeout          120s;

    # ──── Proxy Buffering ────
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;

    # ──── Common proxy headers ────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ──── API Routes → FastAPI Backend ────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # ──── Static Files & Frontend → FastAPI Backend ────
    # (FastAPI serves frontend static files)
    location / {
        proxy_pass http://127.0.0.1:8000;
    }

    # ──── Health Check (for load balancers) ────
    location /health {
        proxy_pass http://127.0.0.1:8000/api/health;
    }

    # ──── Deny access to MCP server directly ────
    location /mcp {
        deny all;
        return 403;
    }

    # ──── Error pages ────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ──── Access log ────
    access_log /var/log/nginx/kubeguardian_access.log;
    error_log  /var/log/nginx/kubeguardian_error.log;
}
